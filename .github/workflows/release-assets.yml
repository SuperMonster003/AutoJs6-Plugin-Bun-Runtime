name: Published release integrity

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to download and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: APK and corresponding-source assets
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download every Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-assets"

      - name: Verify local bytes and GitHub asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apksigner_jar="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f -print | sort -V | tail -n 1)"
          test -n "$apksigner_jar"
          java_executable="$(realpath "$(command -v java)")"
          node tools/bun-runtime/release/verify-corresponding-source-release.mjs \
            --asset-directory "$RUNNER_TEMP/release-assets" \
            --local-repository "$GITHUB_WORKSPACE" \
            --java-executable "$java_executable" \
            --apksigner-jar "$apksigner_jar"
          node tools/bun-runtime/release/publish-github-release.mjs \
            --asset-directory "$RUNNER_TEMP/release-assets" \
            --local-repository "$GITHUB_WORKSPACE" \
            --java-executable "$java_executable" \
            --apksigner-jar "$apksigner_jar"
