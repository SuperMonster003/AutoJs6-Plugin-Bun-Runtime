name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository and runtime payloads
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify pinned Bun executables
        run: node tools/bun-runtime/verify-runtime.mjs

      - name: Run tests, lint, and assemble debug APKs
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            --stacktrace

      - name: Upload debug and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: bun-runtime-debug-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  instrumentation:
    name: Binder and Bun round trip (x86_64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository and runtime payloads
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: ./gradlew connectedDebugAndroidTest --stacktrace
