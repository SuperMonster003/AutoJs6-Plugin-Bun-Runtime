name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository and runtime payloads
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Bun runtime supply-chain inputs
        run: |
          node tools/bun-runtime/verify-runtime.mjs
          node tools/bun-runtime/supervisor/verify-supervisor.mjs
          node --test tools/bun-runtime/supervisor/supervisor-common.test.mjs
          node --test tools/bun-runtime/verify-apk-runtime.test.mjs
          python3 -B tools/bun-runtime/supervisor/test_supervisor.py
          node tools/bun-runtime/experimental/api28/verify-experiment.mjs
          node tools/bun-runtime/experimental/api28/build-experiment.mjs
          node --test \
            tools/bun-runtime/experimental/api28/verify-experiment.test.mjs \
            tools/bun-runtime/experimental/api28/materialize-bun-inputs.test.mjs \
            tools/bun-runtime/experimental/api28/materialize-cargo-inputs.test.mjs \
            tools/bun-runtime/experimental/api28/materialize-source-inputs.test.mjs \
            tools/bun-runtime/experimental/api28/materialize-toolchain-inputs.test.mjs \
            tools/bun-runtime/experimental/api28/materialize-host-package-inputs.test.mjs \
            tools/bun-runtime/experimental/api28/materialize-distribution-source.test.mjs \
            tools/bun-runtime/experimental/api28/build-host-image.test.mjs \
            tools/bun-runtime/experimental/api28/build-experiment.test.mjs \
            tools/bun-runtime/experimental/api28/run-locked-build.test.mjs \
            tools/bun-runtime/experimental/api28/verify-built-runtime.test.mjs \
            tools/bun-runtime/experimental/api28/verify-distribution-source.test.mjs \
            tools/bun-runtime/experimental/api28/app-probe/probe-common.test.mjs \
            tools/bun-runtime/release/release-asset-common.test.mjs

      - name: Re-materialize immutable Bun experiment inputs
        run: |
          node tools/bun-runtime/experimental/api28/materialize-source-inputs.mjs \
            --output-directory "$RUNNER_TEMP/bun-api28-source-prefetch" \
            --group github-archives
          node tools/bun-runtime/experimental/api28/materialize-toolchain-inputs.mjs \
            --output-directory "$RUNNER_TEMP/bun-api28-toolchain-provenance" \
            --group provenance
          node tools/bun-runtime/experimental/api28/materialize-cargo-inputs.mjs \
            --output-directory "$RUNNER_TEMP/bun-api28-cargo" \
            --prepare-directory-source
          node tools/bun-runtime/experimental/api28/materialize-bun-inputs.mjs \
            --output-directory "$RUNNER_TEMP/bun-api28-bun-registry" \
            --prepare-cache
          node tools/bun-runtime/experimental/api28/materialize-distribution-source.mjs \
            --output-directory "$RUNNER_TEMP/bun-api28-distribution-source"

      - name: Replay the Bun v1.4.0 downstream source series
        run: |
          bun_repo="$RUNNER_TEMP/bun-api28-backport"
          git init "$bun_repo"
          git -C "$bun_repo" remote add origin https://github.com/oven-sh/bun.git
          git -C "$bun_repo" fetch --no-tags --depth=1 origin \
            34cbb9a40b4bd1bd767d134a7065e66c2432a676:refs/heads/autojs6-base \
            d6171ce7e2efa4f3eb3e6f5a099da922df15bc0c:refs/heads/autojs6-upstream-head
          node tools/bun-runtime/experimental/api28/verify-backport.mjs \
            --bun-repository "$bun_repo"

      - name: Run tests, lint, and assemble debug APKs
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:verifyDebugApkRuntimeIntegrity \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            --stacktrace

      - name: Compile the isolated API 28 application-process probe
        run: |
          node --input-type=module -e '
            import { mkdtempSync } from "node:fs";
            import { join } from "node:path";
            import { compileProbe } from "./tools/bun-runtime/experimental/api28/app-probe/build-probe.mjs";
            const classes = compileProbe({
              jdk: process.env.JAVA_HOME,
              sdk: process.env.ANDROID_HOME,
              outputDirectory: mkdtempSync(join(process.env.RUNNER_TEMP, "bun-api28-probe-classes-"))
            });
            if (classes.length === 0) throw new Error("No probe classes generated");
          '

      - name: Upload debug and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: bun-runtime-debug-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  instrumentation:
    name: Binder and Bun round trip (API ${{ matrix.api_level }} ${{ matrix.target }}, x86_64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: 33
            target: aosp_atd
          - api_level: 35
            target: google_apis

    steps:
      - name: Check out repository and runtime payloads
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api_level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          script: ./gradlew connectedDebugAndroidTest -PrequiredApiLevel=${{ matrix.api_level }} --stacktrace
